---
default_stages: [pre-commit]

# Exclude markdown and YAML files globally from all hooks
exclude: '^.*\.(md|yaml|yml)$'

repos:
  - repo: https://github.com/astral-sh/ruff-pre-commit
    rev: v0.16.8
    hooks:
      - id: ruff-check
        args: [--fix]
      - id: ruff-format

  - repo: local
    hooks:
      - id: pytest
        name: pytest
        entry: uv run pytest
        language: system
        pass_filenames: false
        files: '\.py$'  # Runs ONLY when .py files are modified
