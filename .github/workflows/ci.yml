---
name: CI

on:
  # push:
  #   branches: [main]
  #   paths-ignore:
  #     - '**.md'
  #     - 'docs/**'
  #     - '.gitignore'
  #     - 'LICENSE'
  # pull_request:
  #   branches: [main]
  #   types: [opened, synchronize, reopened, ready_for_review]
  #   paths-ignore:
  #     - '**.md'
  #     - 'docs/**'
  #     - '.gitignore'
  #     - 'LICENSE'
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read
  pull-requests: read

jobs:
  call-ci:
    if: github.event.pull_request.draft == false || github.event_name == 'workflow_dispatch'
    uses: riccione/github-workflows/.github/workflows/python-ci.yml@7ed8a722bf3860061e17c1b84d0e1cf3a5a2fb5d
