[project]
name = "cursustrace"
version = "0.1.0"
description = "Trace job listings against a CV"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "trafilatura",
    "beautifulsoup4",
    "requests",
    "pydantic",
    "rapidfuzz>=3.14.6",
    "weasyprint>=68.1",
    "markdown-it-py>=4.2.0",
    "nicegui>=3.17.1",
    "click>=8.5.0",
]

[project.scripts]
cursustrace = "cursustrace.cli:cli"

[dependency-groups]
dev = [
    "pytest",
    "mypy",
    "ruff",
    "pypdf>=6.19.0",
    "pytest-asyncio>=1.4.0",
]

[build-system]
requires = ["uv_build>=0.11.21,<0.12.0"]
build-backend = "uv_build"

[tool.mypy]
strict = true

[[tool.mypy.overrides]]
module = ["weasyprint", "weasyprint.*"]
ignore_missing_imports = true

[tool.pytest.ini_options]
asyncio_mode = "auto"

[tool.ruff]
line-length = 100
