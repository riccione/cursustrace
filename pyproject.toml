[project]
name = "cursustrace"
version = "0.1.0"
description = "Trace job listings against a CV"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "streamlit",
    "trafilatura",
    "beautifulsoup4",
    "requests",
    "pydantic",
    "rapidfuzz>=3.14.6",
    "markdown>=3.10.3",
    "xhtml2pdf>=0.2.20",
]

[project.scripts]
cursustrace = "cursustrace.app:run"

[dependency-groups]
dev = [
    "pytest",
    "mypy",
    "ruff",
]

[build-system]
requires = ["uv_build>=0.11.21,<0.12.0"]
build-backend = "uv_build"

[tool.mypy]
strict = true

[[tool.mypy.overrides]]
module = ["markdown", "markdown.*", "xhtml2pdf", "xhtml2pdf.*"]
ignore_missing_imports = true

[tool.ruff]
line-length = 100
