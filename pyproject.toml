[project]
name = "cursustrace"
version = "0.1.0"
description = "Trace job listings against a CV"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "trafilatura>=2.3.1",
    "beautifulsoup4",
    "pydantic>=2.14.1",
    "rapidfuzz>=3.14.6",
    "weasyprint>=68.1",
    "markdown-it-py>=4.2.0",
    "nicegui>=3.18.0",
    "click>=8.5.0",
    "mcp>=2.3.0",
    "curl-cffi==0.16.3",
    "httpx>=0.28",
    "bcrypt>=4.3.0",
]

[project.scripts]
cursustrace = "cursustrace.cli:cli"

[dependency-groups]
dev = [
    "pytest",
    "mypy",
    "ruff>=0.17.1",
    "pypdf>=6.21.1",
    "pytest-asyncio>=1.4.0",
    "pre-commit>=4.7.0",
]

[build-system]
requires = ["uv_build>=0.11.21,<0.14.0"]
build-backend = "uv_build"

[tool.mypy]
strict = true

[[tool.mypy.overrides]]
module = ["weasyprint", "weasyprint.*"]
ignore_missing_imports = true

[tool.pytest.ini_options]
asyncio_mode = "auto"

[tool.ruff]
line-length = 100
