[project]
name = "cursustrace"
version = "0.2.0"
description = "Trace job listings against a CV"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "trafilatura>=2.3.1",
    "beautifulsoup4",
    "pydantic>=2.14.1",
    "rapidfuzz>=3.14.6",
    "weasyprint>=68.1",
    "markdown-it-py>=4.2.0",
    "nicegui>=3.18.0",
    "click>=8.5.0",
    "mcp>=2.3.0",
    "curl-cffi==0.16.3",
    "httpx>=0.28",
    "bcrypt>=4.3.0",
]

[project.scripts]
cursustrace = "cursustrace.cli:cli"

[dependency-groups]
dev = [
    "pytest",
    "mypy",
    "ruff>=0.17.1",
    "pypdf>=6.21.1",
    "pytest-asyncio>=1.4.0",
    "pre-commit>=4.7.0",
]

[build-system]
requires = ["uv_build>=0.11.21,<0.14.0"]
build-backend = "uv_build"

[tool.mypy]
strict = true

[[tool.mypy.overrides]]
module = ["weasyprint", "weasyprint.*"]
ignore_missing_imports = true

[tool.pytest.ini_options]
asyncio_mode = "auto"

[tool.ruff]
line-length = 100

[tool.bumpversion]
current_version = "0.2.0"  # Update this to match your current project version
parse = "(?P<major>\\d+)\\.(?P<minor>\\d+)\\.(?P<patch>\\d+)"
serialize = ["{major}.{minor}.{patch}"]
search = "{current_version}"
replace = "{new_version}"
regex = false
ignore_missing_version = false
tag = false
sign_tags = false
tag_name = "v{new_version}"
tag_message = "Bump version: {current_version} → {new_version}"
allow_dirty = false
commit = true
message = "Bump version: {current_version} → {new_version}"

# Automatically update version in pyproject.toml
[[tool.bumpversion.files]]
filename = "pyproject.toml"

# OPTIONAL: If you also store the version in your package's __init__.py, add it here:
# [[tool.bumpversion.files]]
# filename = "src/your_package_name/__init__.py"
